[project]
name = "atlas-voice-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soumyabrata Roy", email = "soumya11roy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-genai>=2.22.0",
    "kokoro>=0.9.4",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "openai>=3.7.0",
    "openwakeword>=0.4.0",
    "phonemizer>=3.4.0",
    "python-dotenv>=1.2.3",
    "pyttsx3>=2.99",
    "reportlab>=5.0.1",
    "sounddevice>=0.5.6",
    "torch==2.11.0+cu128",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
atlas-voice-assistant = "atlas_voice_assistant:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
